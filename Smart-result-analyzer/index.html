<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Smart Result Analysier</title>
</head>
<body>
    <div class="container">
        <h1>Smart Result Analyzer</h1>
        <input id="marks" type="number" placeholder="Enter marks between (1 to 100)">
        <button id="checkResult">Check Result</button>

        <h2 id="grade"></h2>
        <p id="status"></p>
        <p id="remarks"></p>
       
        <div id="progress">
            <div id="bar"></div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
