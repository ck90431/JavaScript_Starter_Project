<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Smart-Text-Formatter</title>
</head>
<body>

<div class="container">

<h1>Smart Text Formatter</h1>
<textarea placeholder="Type your text here...." id="text"></textarea>

<div id="button">
    <button id="upperCase">UPPERCASE</button>
    <button id="lowerCase">lowercase</button>
    <button id="caplization">Captalization</button>
    <button id="removeSpace">Remove Space</button>
    <button id="reverse">Reverse</button>
    <button id="count">Count</button>
</div>

<h3>Output</h3>
<p id="output"></p>
<button id="reset"> Reset</button>
</div>





<script src="script.js"></script>
</body>
</html>
